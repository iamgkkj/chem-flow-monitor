# ---------------------------------------------------------------------------
# Render Blueprint for Chem Flow Monitor
#
# Deploy: Dashboard > Blueprints > New Blueprint Instance > pick this repo >
#         Apply.  Everything below is created automatically.
#
#   Backend  -> https://chem-flow-backend.onrender.com
#   Frontend -> https://chem-flow-monitor.onrender.com
#   Database -> Render Postgres (free plan expires 30 days after creation)
# ---------------------------------------------------------------------------

services:
  # ---------------------------------------------------------------------
  # Django REST API (web service)
  # ---------------------------------------------------------------------
  - type: web
    name: chem-flow-backend
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --threads 4 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /api/health/
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: chem-flow-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,chem-flow-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://chem-flow-monitor.onrender.com,http://localhost:3000,http://127.0.0.1:3000"
      - key: WEB_CONCURRENCY
        value: "1"
      # Demo login used by the README / QR code. Override DEMO_PASSWORD if
      # you do not want the published demo credentials.
      - key: DEMO_USERNAME
        value: demo
      - key: DEMO_EMAIL
        value: demo@example.com
      - key: CREATE_DEMO_USER
        value: "true"

  # ---------------------------------------------------------------------
  # React dashboard (static site, served from the CDN)
  # ---------------------------------------------------------------------
  - type: web
    name: chem-flow-monitor
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    autoDeployTrigger: commit
    routes:
      # Single page app fallback
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.22.1
      # Baked into the bundle at build time - must match the backend URL.
      - key: REACT_APP_API_URL
        value: https://chem-flow-backend.onrender.com

databases:
  - name: chem-flow-db
    plan: free
    databaseName: chem_flow
    user: chem_flow
